      - type: accordion
        panels:
          - title: English Translation
            content: Just waking up, Peter stepped out of his hotel. His hotel was located in a small alley. The alley was called Alley 143, and Peter noticed that it looked very tiny.
  - title: What is a Maze?
    content:
      - type: image
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/placeholder.png
        alt: Story illustration
      - type: audio
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/cYyqlPn2ee0/audio-segments/page3.mp3
      - type: text
        text: Đường hẻm rất là nhỏ và ngoằng nguèo. Đường hẻm ở trong khách sạn của Peter rất là nhỏ và ngoằng nguèo giống như một mê cung. Mê cung là những cái đường nhỏ và đang sang với nhau. Bạn không biết đường ra mê cung.
      - type: accordion
        panels:
          - title: English Translation
            content: The alley is very small and winding. The alley in Peter's hotel is just as tiny and twisty as a maze. A maze has lots of little paths that cross each other, and you never know how to find your way out.
