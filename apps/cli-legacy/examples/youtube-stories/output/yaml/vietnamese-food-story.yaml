      - type: text
        text: Peter đã tìm ra món ăn Việt Nam mới mà Peter thích. Peter thấy rất là vui. Peter rất là muốn nói cho bạn bè của mình biết về món ăn mới này. Sau khi ăn xong, Peter rất là hạnh phúc. Bởi vì hôm nay được ăn một món ăn Việt Nam mới. Rất ngon. Peter thấy rất hạnh phúc. Peter bắt tay người địa phương kia. Anh bắt tay hai người bắt tay nhau. Và Peter chào anh. Peter nói là hẹn gặp lại.
      - type: accordion
        panels:
          - title: English Translation
            content: Peter discovered a new Vietnamese dish that he really liked. He felt very happy. Peter wanted to tell his friends about this new food. After finishing his meal, Peter was filled with joy because he had enjoyed a delicious Vietnamese dish today. He felt so happy. Peter shook hands with a local person. They both smiled and shook hands. Peter said goodbye and promised to see him again.
