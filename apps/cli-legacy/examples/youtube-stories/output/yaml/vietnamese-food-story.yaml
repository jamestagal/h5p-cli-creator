        alt: Story illustration
      - type: audio
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/cYyqlPn2ee0/audio-segments/page7.mp3
      - type: text
        text: Peter thấy đói bụng quá. Peter muốn tìm đồ ăn. Peter nhìn quanh, nhìn lên những bản hiệu. Peter thấy các món ăn rất là lạ. Không giống như phở hoặc là bánh mì như Peter thường hay ăn. Peter hay ăn phở hoặc bánh mì. Nhưng những món được bán ở cái hẻm này rất là lạ.
      - type: accordion
        panels:
          - title: English Translation
            content: Peter was really hungry. He wanted to find something to eat. Peter looked around, glancing at the signs. He saw some very strange dishes. They weren't like the pho or banh mi that Peter usually ate. He often enjoyed pho or banh mi. But the food being sold in this alley was very unusual.
  - title: Meeting the Local Vendor
    content:
      - type: image
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/placeholder.png
        alt: Story illustration
      - type: audio
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/cYyqlPn2ee0/audio-segments/page8.mp3
      - type: text
        text: Peter chưa bao giờ ăn. Giống như là bánh cuốn, bún riêu, bánh canh. Peter chưa bao giờ ăn những món này. Peter thấy rất là lạ. Có một người dân địa phương ở đây. Anh này bán bánh cuốn và bánh canh. Bánh canh thì thường ăn với súp. Bánh canh thì thường có súp. Còn bánh cuốn thì ăn với nước mắm. Bánh cuốn thì ăn với nước mắm chua ngọt. Cả hai món này Peter đều chưa ăn.
      - type: accordion
        panels:
          - title: English Translation
            content: Peter had never eaten before. He had never tried dishes like rice rolls, crab noodle soup, or tapioca noodles. Peter found this very strange. There was a local person here who sold rice rolls and tapioca noodles. Tapioca noodles are usually served with soup. Rice rolls are eaten with fish sauce, specifically a sweet and sour fish sauce. Peter had never tried either of these dishes.
  - title: Trying the Food
    content:
      - type: image
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/placeholder.png
        alt: Story illustration
      - type: audio
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/cYyqlPn2ee0/audio-segments/page9.mp3
