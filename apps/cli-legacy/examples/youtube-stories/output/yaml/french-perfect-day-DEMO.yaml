# Global AI configuration - demonstrates multi-language AI features
aiConfig:
  targetLanguage: "fr"           # Content in French
  instructionalLanguage: "en"    # Instructions in English (scaffolding for beginners)
  includeTranslations: true      # Add English translations for learners
  targetAudience: "esl-beginner"
