  - title: La réalité - Reality Check
    content:
      - type: image
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/Fhw6aoJ-2qE/images/img-8.jpg
        alt: La réalité - Reality Check
      - type: audio
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/Fhw6aoJ-2qE/audio-segments/page8.mp3
      - type: text
        text: Ça a l'air bien, n'est-ce pas ? Mais je me réveille au son de mon réveil. C'est lundi. Je saute du lit. Je n'ai pas le temps. Je mange rapidement deux sandwiches. Je cours au travail. Je travaille du matin au soir. Je suis assise à un ordinateur et bois trop de café. Pas de vélo, pas de tennis. Le soir, je rentre chez moi, fatiguée. Je ne cuisine pas. Je mange des nouilles dans une boîte. Ensuite, je m'assois sur le canapé et je regarde simplement la télévision. C'est ma vraie journée. Mais bon, peut-être que samedi sera meilleur.
      - type: accordion
        panels:
          - title: English Translation
            content: It sounds nice, doesn't it? But I wake up to the sound of my alarm. It's Monday. I jump out of bed. I don't have time. I quickly eat two sandwiches. I rush to work. I work from morning until evening. I sit at a computer and drink too much coffee. No biking, no tennis. In the evening, I come home, tired. I don't cook. I eat noodles from a box. Then, I sit on the couch and just watch TV. That's my real day. But maybe Saturday will be better.
