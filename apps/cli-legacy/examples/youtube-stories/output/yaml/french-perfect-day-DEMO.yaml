chapters:
  - title: Video Introduction
    content:
      - type: video
        url: https://www.youtube.com/watch?v=Fhw6aoJ-2qE
        title: Video Introduction
      - type: accordion
        panels:
          - title: Video Transcript
            content: Ma journée parfaite Je m'appelle Liam. J'ai 24 ans. Aujourd'hui, je veux vous parler de ma journée parfaite. Je me réveille sans réveil. Je me sens plein d'énergie. Je prends une douche chaude. Puis, je prépare le petit déjeuner. Je mange des crêpes avec du miel et bois du jus d'orange frais. Délicieux. Après le petit déjeuner, je sors. Le temps est superbe. Je monte mon vélo jusqu'au parc. J'écoute de la musique et profite de l'air frais. Plus tard, je me détends sur un banc dans le parc. Je lis un bon livre. L'après-midi, je prends ma raquette de tennis et je vais au cours. Mon ami Jack m'y attend. Nous jouons au tennis pendant une heure. Nous courons beaucoup et frappons la balle avec force. C'est très amusant. Après le match, nous allons dans un petit café. Nous déjeunons et parlons de la vie. Ensuite, je rentre chez moi. Je prépare le dîner. Des pâtes avec des légumes. Je mets de la musique douce et j'apprécie cuisiner. Le soir, je m'assois à mon ordinateur. Je mets mes écouteurs. Je joue à des jeux en ligne avec mes amis. Nous rions beaucoup. C'est ma journée parfaite. Ça a l'air bien, n'est-ce pas? Mais je me réveille au son de mon réveil. C'est lundi. Je saute du lit. Je n'ai pas le temps. Je mange rapidement deux sandwiches. Je cours au travail. Je travaille du matin au soir. Je suis assise à un ordinateur et bois trop de café. Pas de vélo, pas de tennis. Le soir, je rentre chez moi, fatiguée. Je ne cuisine pas. Je mange des nouilles dans une boîte. Ensuite, je m'assois sur le canapé et je regarde simplement la télévision. C'est ma vraie journée. Mais bon, peut-être que samedi sera meilleur.
