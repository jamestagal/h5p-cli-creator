    content:
      - type: image
        path: placeholder.png
        alt: Story illustration
      - type: audio
        path: .youtube-cache/cYyqlPn2ee0/audio-segments/page4.mp3
      - type: text
        text: Cái hẻm ở trên đường hẻm của khách sạn của Peter giống như cái mê cung vậy đó. Nhỏ và ngoằng nguèo. Nhiều nhà sang sát với nhau. Nhiều nhà gần gần với nhau. Peter nhìn quanh. Peter nhìn xung quanh. Peter nhìn xung quanh. Peter thấy ai cũng đang ăn hết. Peter thấy ai cũng đang ăn.
      - type: accordion
        panels:
          - title: English Translation
            content: The alley behind Peter's hotel was like a maze. It was small and winding, with many houses close together. Peter looked around. He saw that everyone was eating. He noticed that everyone was enjoying their food.
