      - type: accordion
        panels:
          - title: English Translation
            content: Peter's hotel is located in a little alley. The hotel is on Alley 143. Peter noticed that this alley looks very small. The alley is quite narrow and winding. The alley where Peter's hotel is situated is very small and twisty.
