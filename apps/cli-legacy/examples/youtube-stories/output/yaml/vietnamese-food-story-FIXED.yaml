      - type: accordion
        panels:
          - title: English Translation
            content: Peter was very hungry. He could smell food everywhere. Everyone around him was eating. Peter was so hungry. He wanted to find something to eat.
  - title: Strange Foods
    content:
      - type: image
        path: placeholder.png
        alt: Story illustration
      - type: audio
        path: .youtube-cache/cYyqlPn2ee0/audio-segments/page7.mp3
      - type: text
        text: Peter nhìn quanh, nhìn lên những bản hiệu. Peter thấy các món ăn rất là lạ. Không giống như phở hoặc là bánh mì như Peter thường hay ăn. Peter hay ăn phở hoặc bánh mì. Nhưng những món được bán ở cái hẻm này rất là lạ. Peter chưa bao giờ ăn. Giống như là bánh cuốn, bún riêu, bánh canh. Peter chưa bao giờ ăn những món này. Peter thấy rất là lạ.
      - type: accordion
        panels:
          - title: English Translation
            content: Peter looked around and up at the signs. He saw some very strange foods. They were nothing like pho or banh mi, which Peter usually ate. He often enjoyed pho or banh mi, but the dishes sold in this alley were very unusual. Peter had never tried them before. There were things like banh cuon, bun rieu, and banh canh. Peter found them all very strange.
  - title: Meeting the Local Vendor
    content:
      - type: image
        path: placeholder.png
        alt: Story illustration
      - type: audio
        path: .youtube-cache/cYyqlPn2ee0/audio-segments/page8.mp3
      - type: text
        text: Có một người dân địa phương ở đây. Anh này bán bánh cuốn và bánh canh. Bánh canh thì thường ăn với súp. Bánh canh thì thường có súp. Còn bánh cuốn thì ăn với nước mắm. Bánh cuốn thì ăn với nước mắm chua ngọt. Cả hai món này Peter đều chưa ăn. Cho nên là Peter nghĩ là OK, mình nên thử ăn cái này. Mình nên thử ăn cái này. Cho biết là nó có ngon hay là không.
      - type: accordion
        panels:
          - title: English Translation
            content: There was a local person here who sold rice rolls and noodle soup. Noodle soup is usually eaten with broth, while rice rolls are enjoyed with sweet and sour fish sauce. Peter had never tried either of these dishes before. So, he thought, "Okay, I should give this a try. I should see if it's tasty or not."
  - title: Trying the Food
    content:
      - type: image
        path: placeholder.png
        alt: Story illustration
      - type: audio
        path: .youtube-cache/cYyqlPn2ee0/audio-segments/page9.mp3
      - type: text
        text: Người địa phương này đã giới thiệu cho Peter món ăn mới. Đó là bánh cuốn và bánh canh. Peter ăn thử. Peter ăn hai món. Peter đã ăn một lần hai món luôn. Hai tay hai món. Bên này là bánh cuốn. Bên này là bánh canh. Peter ăn một lần hai món. Và Peter thấy Wow, cái món này rất rất rất rất rất là ngon. Cái món này rất rất là ngon. Peter chưa bao giờ ăn món nào ngon như vậy. Peter đã tìm ra món ăn Việt Nam mới mà Peter thích. Peter thấy rất là vui. Peter rất là muốn nói cho bạn bè của mình biết về món ăn mới này.
      - type: accordion
        panels:
          - title: English Translation
            content: The local person introduced Peter to a new dish. It was bánh cuốn and bánh canh. Peter gave them a try. He ate both dishes at once. One dish in each hand. On this side was bánh cuốn. On that side was bánh canh. Peter tasted both dishes together. And he thought, "Wow, this is so, so, so, so, so delicious!" This dish was really, really tasty. Peter had never eaten anything as good as this before. He discovered a new Vietnamese food that he loved. Peter felt very happy. He really wanted to tell his friends about this new dish!
  - title: Happy Ending
    content:
      - type: image
        path: placeholder.png
        alt: Story illustration
      - type: audio
        path: .youtube-cache/cYyqlPn2ee0/audio-segments/page10.mp3
      - type: text
        text: Sau khi ăn xong, Peter rất là hạnh phúc. Bởi vì hôm nay được ăn một món ăn Việt Nam mới. Rất ngon. Peter thấy rất hạnh phúc. Peter bắt tay người địa phương kia. Anh bắt tay hai người bắt tay nhau. Và Peter chào anh. Peter nói là hẹn gặp lại. Hẹn gặp lại. Tôi sẽ quay lại đây để ăn món này. Peter muốn quay lại cái hẻm này để ăn bánh cuốn và bánh canh.
      - type: accordion
        panels:
          - title: English Translation
            content: After finishing his meal, Peter felt very happy. Today, he got to try a new Vietnamese dish. It was delicious! Peter was really joyful. He shook hands with the local person. They both smiled and greeted each other. Peter said he would see him again. "See you later! I’ll come back here to eat this dish again." Peter wanted to return to this alley to enjoy bánh cuốn and bánh canh.
