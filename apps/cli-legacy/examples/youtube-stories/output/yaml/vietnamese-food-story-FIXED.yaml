        text: giống như một mê cung. Mê cung là những cái đường nhỏ và đang sang với nhau. Bạn không biết đường ra mê cung. Mình rất khó để tìm đường ra. Rất khó để tìm đường ở trong mê cung.
      - type: accordion
        panels:
          - title: English Translation
            content: like a maze. A maze has small paths that twist and turn. You don't know how to find your way out of the maze. It's really hard to find the way out. It's very difficult to navigate inside a maze.
