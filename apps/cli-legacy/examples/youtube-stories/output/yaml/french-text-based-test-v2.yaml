      - type: text
        text: Je suis assise à un ordinateur et bois trop de café. Pas de vélo, pas de tennis. Le soir, je rentre chez moi, fatiguée. Je ne cuisine pas. Je mange des nouilles dans une boîte. Ensuite, je m'assois sur le canapé et je regarde simplement la télévision. C'est ma vraie journée. Mais bon, peut-être que samedi sera meilleur.
      - type: accordion
        panels:
          - title: English Translation
            content: I sit at a computer and drink too much coffee. No biking, no tennis. In the evening, I go home, tired. I don’t cook. I eat noodles from a box. Then, I sit on the couch and just watch TV. That’s my real day. But maybe Saturday will be better.
