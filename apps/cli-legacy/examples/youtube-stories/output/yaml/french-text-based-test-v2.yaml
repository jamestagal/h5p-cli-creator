      - type: accordion
        panels:
          - title: English Translation
            content: I play soft music and enjoy cooking. In the evening, I sit at my computer. I put on my headphones. I play online games with my friends. We laugh a lot. It's my perfect day. Sounds nice, doesn’t it? But then I wake up to the sound of my alarm clock.
