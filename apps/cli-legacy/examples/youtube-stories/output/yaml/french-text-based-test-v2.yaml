        path: .youtube-cache/Fhw6aoJ-2qE/audio-segments/page4.mp3
      - type: text
        text: Plus tard, je me détends sur un banc dans le parc. Je lis un bon livre. L'après-midi, je prends ma raquette de tennis et je vais au cours. Mon ami Jack m'y attend. Nous jouons au tennis pendant une heure. Nous courons beaucoup et frappons la balle avec force. C'est très amusant. Après le match, nous allons dans un petit café.
      - type: accordion
        panels:
          - title: English Translation
            content: Later, I relax on a bench in the park. I'm reading a good book. In the afternoon, I grab my tennis racket and head to practice. My friend Jack is waiting for me there. We play tennis for an hour. We run a lot and hit the ball hard. It's so much fun! After the match, we go to a little café.
