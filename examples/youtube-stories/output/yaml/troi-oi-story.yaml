      - type: text
        text: Rồi Peter đi tiếp. Peter thấy một bà bán trái cây và một cô đang nói chuyện với nhau. Peter nghe thoang thoảng được là cô gái này nói Trời ơi! Hôm nay trái cây mắc quá! Hôm nay trái cây mắc quá! Peter đã nghe cô gái này phàn nàng. Hôm nay trái cây mắc quá!
      - type: accordion
        panels:
          - title: English Translation
            content: 'Then Peter continued on his way. He saw a fruit seller and a girl talking to each other. Peter caught a glimpse of what the girl was saying: "Oh my! The fruit is so expensive today! The fruit is so expensive today!" Peter heard her complaining, "The fruit is so expensive today!"'
