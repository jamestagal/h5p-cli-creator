        text: Rồi Peter gọi. Em ơi! Tính tiền! Peter thấy hôm nay là một ngày rất vui vì mình được cho đồ ăn và mình được nghe người Việt Nam nói trời ơi rất là nhiều.
      - type: accordion
        panels:
          - title: English Translation
            content: Then Peter called out, "Hey there! Time to pay!" He felt that today was a very happy day because he got to eat delicious food and heard Vietnamese people say "Oh my gosh!" many times.
  - title: Rain Ending
    content:
      - type: image
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/Y8M9RJ_4C7E/images/img-11.jpg
        alt: Rain Ending
      - type: audio
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/Y8M9RJ_4C7E/audio-segments/page11.mp3
      - type: text
        text: Nhưng vừa tính tiền xong, trời đổ mưa. Peter không về nhà được. Peter nói trời ơi! Mưa lớn quá! Vậy là Peter cũng đã nói trời ơi! Giống như người Việt Nam rồi. Đó là câu chuyện của ngày hôm nay.
      - type: accordion
        panels:
          - title: English Translation
            content: But just as he finished paying, it started to rain. Peter couldn't go home. He exclaimed, "Oh no! It's raining too hard!" And just like that, Peter had said "Oh no!" just like a Vietnamese person would. That's the story for today.
  - title: Practice Activities
    content:
      - type: text
        title: Test Your Understanding
        text: Now let's practice what we learned from Peter's adventure! Test your knowledge of the story and Vietnamese expressions.

      - type: ai-single-choice-set
        title: Story Comprehension Quiz
        prompt: |
          Based on Peter's story about learning the Vietnamese expression "Trời ơi!", create 5 multiple choice questions about the story events and when Vietnamese people use this phrase. Each question should have one correct answer and 3 plausible distractors.

          Story summary: Peter walked outside and heard many people saying "Trời ơi!" in different situations - a man warning about a chicken, a girl complaining about expensive fruit, men arguing at a café, someone watching a funny video, a waitress apologizing for spilling coffee, a child enjoying food, an elderly woman concerned Peter looks thin, and finally Peter himself saying it when it started raining.
        questionCount: 5

      - type: ai-fill-in-the-blanks
        title: Vietnamese Phrases Practice
        prompt: |
          Create 3 fill-in-the-blank exercises using key Vietnamese phrases from Peter's story about "Trời ơi!". Include phrases like "Trời ơi!", "Em ơi!", "Coi chừng", "mắc quá", "ngon quá", etc. Make sure the blanks test understanding of when to use these expressions.
        questionCount: 3

      - type: ai-true-false
        title: Story Facts Quiz
        prompt: |
          Create 3 true/false questions about facts mentioned in Peter's story about learning "Trời ơi!". Include questions about story events, locations, and what happened to Peter.
        questionCount: 3

      - type: ai-accordion
        title: Vietnamese Expression Summary
        prompt: Create a summary accordion with 4-5 panels explaining key Vietnamese expressions learned in Peter's story. Focus on "Trời ơi!" and when Vietnamese people use it (surprise, frustration, concern, delight). Include other expressions like "Em ơi!" and "Coi chừng!".
        panelCount: 5
        style: summary
