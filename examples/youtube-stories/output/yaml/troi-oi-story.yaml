        text: Tiếp theo, một bà, một bà lão lớn tuổi nhìn thấy Peter. Bà tới gần và nói trời ơi! Con ốm quá! Ăn đi con! Đồ ăn đây! Ăn đi! Bà lão thấy Peter ốm nên muốn cho Peter ăn.
      - type: accordion
        panels:
          - title: English Translation
            content: Next, an elderly woman saw Peter. She came closer and exclaimed, "Oh my! You’re so thin! Eat, dear! Here’s some food! Go ahead and eat!" The old woman noticed Peter was skinny and wanted to feed him.
