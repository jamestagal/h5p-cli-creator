      - type: accordion
        panels:
          - title: English Translation
            content: Then, when the waitress brought the coffee, she accidentally spilled it. The waitress exclaimed, "Oh no! I'm so sorry! I'm so sorry!" Once again, Peter heard the words "oh no" from a Vietnamese person.
