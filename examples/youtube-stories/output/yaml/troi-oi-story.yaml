title: Peter learns how to say Trời ơi!
language: vi
chapters:
  - title: Video Introduction
    content:
      - type: video
        url: https://www.youtube.com/watch?v=Y8M9RJ_4C7E
        title: Video Introduction
      - type: accordion
        panels:
          - title: Video Transcript
            content: Hôm nay Peter đã đi ra ngoài đường và nghe rất là nhiều những câu bắt đầu bằng Trời ơi! Trời ơi! Bạn cùng nghe câu chuyện với mình nha! Một ngày đẹp trời, Peter đang đi dạo ở ngoài đường. Bỗng, có một chú đi xe từ phía sau đi tới và hét lên Trời ơi! Coi chừng con gà! Peter nhìn lại và thấy một con gà đang đi ở ngoài đường. Peter thấy rất là lạ. Tại sao lại có con gà đi ở ngoài đường? Rồi Peter đi tiếp. Peter thấy một bà bán trái cây và một cô đang nói chuyện với nhau. Peter nghe thoang thoảng được là cô gái này nói Trời ơi! Hôm nay trái cây mắc quá! Hôm nay trái cây mắc quá! Peter đã nghe cô gái này phàn nàng. Hôm nay trái cây mắc quá! Rồi Peter đi tiếp tới một quán cà phê vỉa hè. Peter nói với nhân viên Em ơi! Cho anh một ly cà phê sữa đá. Cô nhân viên vui vẻ nói Ok anh! Đợi em một xíu. Peter thấy vui vì mình sắp được uống cà phê rồi. Nhưng Peter nhìn qua bên bàn bên kia. Thấy hai chú, hai chú lớn tuổi đang uống bia. Một hai bà vô. Hai chú đang uống bia nhưng cũng cãi nhau về một chuyện gì đó. Một chú nói Trời ơi! Không phải như vậy đâu! Trời ơi! Không phải như vậy! Peter thấy lạ quá. Sao ở Việt Nam mọi người nói trời ơi nhiều quá vậy? Rồi Peter nhìn qua bên kia đường. Thấy một chú đang coi video trên điện thoại. Rồi chú hét lên Trời ơi! Mắc cười quá! Trời ơi! Mắc cười quá! Peter thấy lạ thêm một lần nữa. Ai cũng thích nói trời ơi ở Việt Nam sao? Rồi khi cô nhân viên mang cà phê tới. Cô nhân viên đã lỡ làm đổ cà phê. Cô nhân viên nói trời ơi! Em xin lỗi! Em xin lỗi! Lại một lần nữa. Peter nghe tiếng nói trời ơi từ người Việt Nam. Rồi Peter thấy một gia đình đang ngồi ăn cơm với nhau. Rất là hạnh phúc. Cậu bé nhỏ này thì nói trời ơi! Đồ ăn hôm nay ngon quá! Tiếp theo, một bà, một bà lão lớn tuổi nhìn thấy Peter. Bà tới gần và nói trời ơi! Con ốm quá! Ăn đi con! Đồ ăn đây! Ăn đi! Bà lão thấy Peter ốm nên muốn cho Peter ăn. Rồi Peter gọi. Em ơi! Tính tiền! Peter thấy hôm nay là một ngày rất vui vì mình được cho đồ ăn và mình được nghe người Việt Nam nói trời ơi rất là nhiều. Nhưng vừa tính tiền xong, trời đổ mưa. Peter không về nhà được. Peter nói trời ơi! Mưa lớn quá! Vậy là Peter cũng đã nói trời ơi! Giống như người Việt Nam rồi. Đó là câu chuyện của ngày hôm nay.
