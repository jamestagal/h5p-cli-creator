        text: Rồi Peter nhìn qua bên kia đường. Thấy một chú đang coi video trên điện thoại. Rồi chú hét lên Trời ơi! Mắc cười quá! Trời ơi! Mắc cười quá! Peter thấy lạ thêm một lần nữa. Ai cũng thích nói trời ơi ở Việt Nam sao?
      - type: accordion
        panels:
          - title: English Translation
            content: Then Peter looked across the street. He saw a boy watching a video on his phone. Suddenly, the boy shouted, "Oh my gosh! That's so funny! Oh my gosh! That's so funny!" Peter found it strange once again. Does everyone in Vietnam like to say "oh my gosh"?
