      - type: accordion
        panels:
          - title: English Translation
            content: Today, Peter went outside and heard a lot of phrases starting with "Oh my!" Oh my! Come listen to the story with me! One beautiful day, Peter was taking a stroll down the street.
  - title: Watch Out for the Chicken!
    content:
      - type: image
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/Y8M9RJ_4C7E/images/img-2.jpeg
        alt: Watch Out for the Chicken!
      - type: audio
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/Y8M9RJ_4C7E/audio-segments/page2.mp3
      - type: text
        text: Bỗng, có một chú đi xe từ phía sau đi tới và hét lên Trời ơi! Coi chừng con gà! Peter nhìn lại và thấy một con gà đang đi ở ngoài đường. Peter thấy rất là lạ. Tại sao lại có con gà đi ở ngoài đường?
      - type: accordion
        panels:
          - title: English Translation
            content: Suddenly, a man riding a bike came from behind and shouted, "Oh no! Watch out for the chicken!" Peter turned around and saw a chicken walking in the street. Peter thought it was very strange. Why was there a chicken walking on the road?
