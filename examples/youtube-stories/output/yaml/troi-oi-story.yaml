        text: Rồi Peter đi tiếp tới một quán cà phê vỉa hè. Peter nói với nhân viên Em ơi! Cho anh một ly cà phê sữa đá. Cô nhân viên vui vẻ nói Ok anh! Đợi em một xíu. Peter thấy vui vì mình sắp được uống cà phê rồi.
      - type: accordion
        panels:
          - title: English Translation
            content: Then Peter walked over to a sidewalk café. He said to the staff, "Excuse me! Can I have an iced milk coffee, please?" The cheerful staff replied, "Sure! Just wait a moment." Peter felt happy because he was about to enjoy his coffee.
  - title: Two Men Arguing
    content:
      - type: image
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/Y8M9RJ_4C7E/images/img-5.jpg
        alt: Two Men Arguing
      - type: audio
        path: /Users/benjaminwaller/Projects/H5P-LMS/h5p-cli-creator/.youtube-cache/Y8M9RJ_4C7E/audio-segments/page5.mp3
      - type: text
        text: Nhưng Peter nhìn qua bên bàn bên kia. Thấy hai chú, hai chú lớn tuổi đang uống bia. Một hai bà vô. Hai chú đang uống bia nhưng cũng cãi nhau về một chuyện gì đó. Một chú nói Trời ơi! Không phải như vậy đâu! Trời ơi! Không phải như vậy! Peter thấy lạ quá. Sao ở Việt Nam mọi người nói trời ơi nhiều quá vậy?
      - type: accordion
        panels:
          - title: English Translation
            content: But Peter looked over to the table next to him. He saw two older men drinking beer. A couple of ladies came in. The two men were drinking beer but also arguing about something. One of the men said, "Oh my gosh! That's not how it is! Oh my gosh! That's not it!" Peter found it very strange. Why do people in Vietnam say "oh my gosh" so much?
