lockfileVersion: '9.0'

importers:

  packages/engine:
    dependencies:
      '@leaplearn/shared':
        specifier: workspace:*
        version: link:../shared
      a:
        specifier: ^1.0.0
        version: 1.0.0
      d-alias:
        specifier: npm:d@^4.0.0
        version: d@4.0.0
    devDependencies:
      dev-only:
        specifier: ^9.0.0
        version: 9.0.0

  packages/shared:
    dependencies:
      '@scope/p':
        specifier: ^2.0.0
        version: 2.0.0(c@3.0.0)

  apps/unrelated:
    dependencies:
