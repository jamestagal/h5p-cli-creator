        specifier: ^1.0.0
        version: 1.0.0

packages:

  '@scope/p@2.0.0':
    resolution: {integrity: sha512-scopep}

  a@1.0.0:
    resolution: {integrity: sha512-aaa}

  b@2.1.0:
    resolution: {integrity: sha512-bbb}

  c@3.0.0:
    resolution: {integrity: sha512-ccc}

  d@4.0.0:
    resolution: {integrity: sha512-ddd}

  dev-only@9.0.0:
    resolution: {integrity: sha512-dev}

  unrelated@1.0.0:
    resolution: {integrity: sha512-unrelated}

snapshots:

  '@scope/p@2.0.0(c@3.0.0)':
    dependencies:
      c: 3.0.0

  a@1.0.0:
    dependencies:
      b: 2.1.0

  b@2.1.0:
    dependencies:
      c: 3.0.0

  c@3.0.0: {}

  d@4.0.0: {}

  dev-only@9.0.0: {}

  unrelated@1.0.0: {}
